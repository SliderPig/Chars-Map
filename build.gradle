plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0'
group = 'com.example.charmap'

base {
    archivesName = 'charmap'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                charmap {
                    source sourceSets.main
                }
            }
        }
    }
}

// gradlew build -Psmoke -x test: adds src/smoke, the walk through the real game that tools/run_real_client.py starts. Never part of the normal jar.
if (project.hasProperty('smoke')) {
    sourceSets.main.java.srcDir 'src/smoke/java'
    sourceSets.main.resources.srcDir 'src/smoke/resources'
    // gradlew runGameTestServer -Psmoke: a real dedicated server with this mod, proves it starts without a PC's code and reads real saves
    minecraft.runs {
        gameTestServer {
            workingDirectory project.file('run-smoke')
            property 'forge.enabledGameTestNamespaces', 'charmap'
            property 'forge.logging.console.level', 'info'
            mods {
                charmap {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'charmap.refmap.json'
    config 'charmap.mixins.json'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'   : 'charmap',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'MixinConfigs'          : 'charmap.mixins.json'
        ])
    }
}
